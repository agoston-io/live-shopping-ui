subscription oneChat($topic: String!, $broadcastId: Int!) {
  listen(topic: $topic) {
    oneChat: query {
      currentTs
      chats(
        condition: { broadcastId: $broadcastId }
        orderBy: CREATED_AT_DESC
      ) {
        nodes {
          content
          createdAt
          id
          user {
            username
          }
        }
      }
    }
  }
}
